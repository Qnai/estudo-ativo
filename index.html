<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Estudo Ativo">
    <title>Estudo Ativo - Caderno Inteligente na Nuvem</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <!-- Marked.js para renderizar respostas da IA em Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: calc(5.5rem + env(safe-area-inset-bottom));
        }

        .prose-study {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .prose-study h1, .prose-study h2, .prose-study h3 {
            font-weight: 800;
            color: #1e293b;
            margin-top: 0.5rem;
            margin-bottom: 0.15rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .prose-study h2 {
            font-size: 1.05rem;
            color: #0f172a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.35rem;
        }
        .prose-study h3 { 
            font-size: 0.92rem; 
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: #4338ca;
            background: #eef2ff;
            padding: 0.45rem 0.75rem;
            border-radius: 0.65rem;
            border-left: 4px solid #4f46e5;
        }
        .prose-study p {
            margin-bottom: 0.25rem;
            line-height: 1.6;
            color: #334155;
            font-size: 0.93rem;
        }
        .prose-study ul, .prose-study ol {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
            margin-bottom: 0.25rem;
            padding-left: 0;
            list-style: none;
        }
        .prose-study li {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            padding: 0.65rem 0.85rem;
            line-height: 1.55;
            color: #334155;
            font-size: 0.91rem;
        }
        .prose-study li.opt-correct {
            background: #f0fdf4;
            border-color: #86efac;
            border-left: 4px solid #16a34a;
            color: #14532d;
        }
        .prose-study li.opt-wrong {
            background: #fef2f2;
            border-color: #fecaca;
            border-left: 4px solid #ef4444;
            color: #7f1d1d;
        }
        .prose-study strong {
            color: #0f172a;
            font-weight: 700;
        }
        .prose-study blockquote {
            border-left: 4px solid #f59e0b;
            background: linear-gradient(to right, #fffbeb, #fef3c7);
            padding: 0.75rem 0.9rem;
            border-radius: 0.75rem;
            margin: 0.25rem 0;
            color: #78350f;
            font-size: 0.9rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }
        .prose-study table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin: 0.25rem 0;
            font-size: 0.85rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.75rem;
            overflow: hidden;
        }
        .prose-study th {
            background-color: #1e293b;
            color: #ffffff;
            font-weight: 700;
            text-align: left;
            padding: 0.6rem 0.75rem;
        }
        .prose-study td {
            padding: 0.6rem 0.75rem;
            border-top: 1px solid #e2e8f0;
            background-color: #ffffff;
            color: #334155;
        }
        .prose-study tr:nth-child(even) td {
            background-color: #f8fafc;
        }
        .prose-study code {
            background-color: #e0e7ff;
            color: #3730a3;
            padding: 0.15rem 0.4rem;
            border-radius: 0.35rem;
            font-size: 0.84em;
            font-weight: 600;
        }

        .flashcard-item {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .flashcard-item:active {
            transform: scale(0.99);
        }

        .bottom-nav {
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.22s ease-out forwards;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased selection:bg-indigo-100 selection:text-indigo-900">

    <!-- MODAL DE BLOQUEIO POR PIN (OPCIONAL) -->
    <div id="pin-lock-overlay" class="hidden fixed inset-0 z-50 bg-slate-900/95 backdrop-blur-sm flex items-center justify-center p-6">
        <div class="bg-white rounded-3xl p-6 max-w-xs w-full text-center shadow-2xl space-y-4">
            <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center mx-auto">
                <i data-lucide="lock" class="w-6 h-6"></i>
            </div>
            <div>
                <h2 class="text-base font-extrabold text-slate-900">Caderno Protegido</h2>
                <p class="text-xs text-slate-500 mt-1">Digite seu PIN de 4 dígitos para acessar suas chaves e questões.</p>
            </div>
            <input type="password" id="pin-unlock-input" maxlength="4" inputmode="numeric" placeholder="••••" oninput="checkPinUnlock()" class="w-full text-center text-2xl font-extrabold tracking-[0.5em] py-3 rounded-xl border-2 border-slate-200 focus:border-indigo-500 outline-none">
            <p id="pin-error-msg" class="hidden text-xs font-semibold text-rose-600">PIN incorreto. Tente novamente.</p>
        </div>
    </div>

    <!-- HEADER SUPERIOR -->
    <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200/80 px-4 py-3">
        <div class="max-w-3xl mx-auto flex items-center justify-between gap-2">
            <div class="flex items-center gap-2.5 min-w-0">
                <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-sm shrink-0">
                    <i data-lucide="brain-circuit" class="w-5 h-5"></i>
                </div>
                <div class="truncate">
                    <h1 class="font-bold text-slate-900 text-base leading-tight truncate">Estudo Ativo</h1>
                    <p class="text-[11px] text-slate-500 font-medium truncate">Aulas + Questões na Nuvem</p>
                </div>
            </div>
            
            <div class="flex items-center gap-1.5 shrink-0">
                <button type="button" id="cloud-status-badge" onclick="syncFromCloud(true)" title="Sincronizar com a Nuvem" class="text-[11px] font-bold px-2 py-1.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200 flex items-center gap-1 active:scale-95 transition">
                    <span class="w-2 h-2 rounded-full bg-slate-400"></span> Local
                </button>

                <button type="button" id="api-status-badge" onclick="quickToggleProvider()" title="Toque para alternar entre Groq e Gemini" class="text-[11px] font-bold px-2.5 py-1.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200 flex items-center gap-1 active:scale-95 transition">
                    <span class="w-2 h-2 rounded-full bg-amber-500"></span> Configurar API
                </button>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="max-w-3xl mx-auto px-4 pt-4">

        <!-- ========================================== -->
        <!-- ABA 1: ESTUDAR (AULA OU QUESTÃO)           -->
        <!-- ========================================== -->
        <section id="tab-study" class="space-y-4 animate-fade-in">
            
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200/90 p-4 space-y-3.5">
                
                <!-- Seletor de Modo de Estudo -->
                <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl">
                    <button type="button" id="mode-btn-question" onclick="setStudyMode('question')" class="py-2 px-3 rounded-lg bg-white text-indigo-700 font-bold text-xs shadow-sm flex items-center justify-center gap-1.5 transition">
                        <span>🎯 Corrigir Questão</span>
                    </button>
                    <button type="button" id="mode-btn-lesson" onclick="setStudyMode('lesson')" class="py-2 px-3 rounded-lg text-slate-600 font-semibold text-xs flex items-center justify-center gap-1.5 transition">
                        <span>👨‍🏫 Modo Professor (Aula)</span>
                    </button>
                </div>

                <div class="flex items-center justify-between">
                    <h2 id="study-input-title" class="font-semibold text-slate-800 text-sm flex items-center gap-1.5">
                        <i data-lucide="file-text" class="w-4 h-4 text-indigo-600"></i>
                        1. Inserir Questão ou Material
                    </h2>
                    <button type="button" onclick="resetStudyForm()" id="btn-clear-input" class="hidden text-xs text-slate-400 hover:text-rose-500 font-medium flex items-center gap-1">
                        <i data-lucide="x" class="w-3.5 h-3.5"></i> Limpar
                    </button>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label id="study-prompt-label" for="user-prompt-text" class="text-xs font-semibold text-slate-600">Cole o texto completo da questão ou sua dúvida</label>
                        <span class="text-[10px] text-slate-400">Expande automaticamente</span>
                    </div>
                    <textarea id="user-prompt-text" rows="6" oninput="autoResizeTextarea(this)" placeholder="Cole aqui o enunciado e as alternativas (A, B, C, D, E ou Certo/Errado)..." class="w-full rounded-xl border border-slate-300 px-3.5 py-3 text-sm leading-relaxed focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition resize-y min-h-[155px]"></textarea>
                </div>

                <div class="pt-0.5">
                    <label for="file-upload" id
